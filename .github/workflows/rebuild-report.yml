name: Rebuild CSET485 Assignment Report

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Execute notebook (source-of-truth check)
        run: |
          jupyter nbconvert --to notebook --execute CSET485_A1_Gautam_S24CSEU0777.ipynb \
            --output /tmp/CSET485_A1_executed.ipynb \
            --ExecutePreprocessor.timeout=1200
          cp results.json results_from_nb.json

      - name: Execute script and compare with notebook
        run: |
          cp results.json /tmp/results_from_nb.json
          python full_analysis.py
          python - <<'PY'
          import json
          from pathlib import Path
          nb=json.loads(Path('/tmp/results_from_nb.json').read_text())
          sc=json.loads(Path('results.json').read_text())
          if nb != sc:
              raise SystemExit('STOP: notebook and full_analysis.py disagree')
          print('PASS: notebook and script results.json are identical')
          PY
          cp /tmp/results_from_nb.json results_from_nb.json

      - name: Add report-specific metrics
        run: python augment_results.py

      - name: Build PDF from results.json
        run: python build_report.py

      - name: Regenerate README from results.json
        run: python update_readme.py

      - name: Verify generated artifacts
        run: |
          test -s results.json
          test -s results_from_nb.json
          test -s chart_modelA_hist.png
          test -s chart_agreement.png
          test -s chart_fairness_tradeoff.png
          test -s chart_ovb.png
          test -s CSET485_A1_Report_Gautam_S24CSEU0777.pdf
          test -s report_audit.md
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('results.json').read_text())
          required=['sex_base_rates','male_relationship_wife_count','sm_selfemp','adversarial','fairness_tradeoff_075_085','q6_pair','report_config']
          missing=[k for k in required if k not in r]
          if missing: raise SystemExit(f'Missing required results keys: {missing}')
          print('PASS: required results keys and generated files exist')
          PY

      - name: Commit generated report artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results.json results_from_nb.json chart_modelA_hist.png chart_agreement.png chart_fairness_tradeoff.png chart_ovb.png CSET485_A1_Report_Gautam_S24CSEU0777.pdf report_audit.md README.md
          git diff --cached --quiet || git commit -m 'Rebuild CSET485 assignment report [skip ci]'
          git push
